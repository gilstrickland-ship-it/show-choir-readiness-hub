name: platform-ci

# Tenant isolation is existential (Constitution I): the RLS suite is CI-blocking
# and runs against a real Postgres 16 on every change.
# Private repo: every job minute counts against the account's 2,000 free
# Actions minutes. Run only on PRs and pushes to main — unfiltered `on: push`
# plus the pull_request event double-ran every PR branch and burned the full
# monthly quota on WIP pushes.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same branch/PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  platform:
    name: typecheck · build · rls
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # applySchema() creates the auth stubs + anon/authenticated/service_role
      # roles as superuser, then applies all migrations and seeds the two-program set.
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: RLS suite (tenant isolation)
        run: npm run test:rls

  e2e:
    name: e2e · user journeys
    runs-on: ubuntu-latest

    env:
      APP_BASE_URL: http://localhost:3000
      TOKEN_IP_LIMIT_PER_MIN: '10000'
      TOKEN_LIMIT_PER_MIN: '10000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`: resolving "latest" asks the GitHub releases API
          # on every run and fails the whole job when that rate-limits
          # ("Failed to resolve latest Supabase CLI release"), which is an
          # external outage failing a green commit. Bump deliberately.
          version: 2.110.0

      - name: Start Supabase local stack
        # `supabase start` blocks until the stack is healthy. On failure, dump
        # status + container state so the first CI run is diagnosable.
        run: |
          supabase start || {
            echo "::error::supabase start failed"
            supabase status || true
            docker ps -a || true
            exit 1
          }

      - name: Apply migrations + seed
        # Guarantee a clean, fully-migrated + seeded local DB (idempotent seed).
        run: supabase db reset

      - name: Export Supabase env
        # `supabase status -o env` prints KEY="value" lines (API_URL, ANON_KEY,
        # SERVICE_ROLE_KEY). Remap to the app's names + the admin names the
        # Playwright global-setup reads.
        run: |
          eval "$(supabase status -o env)"
          : "${API_URL:=${SUPABASE_URL:-http://localhost:54321}}"
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Supabase keys not found in \`supabase status -o env\`"
            supabase status -o env || true
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          echo "Supabase URL: $API_URL (anon key ${#ANON_KEY} chars, service key ${#SERVICE_ROLE_KEY} chars)"

      - name: Install Playwright browser (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: E2E user journeys
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
